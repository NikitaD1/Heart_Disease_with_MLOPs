name: CI/CD - heart disease MLOps

# Lint -> unit tests -> train (MLflow).
# Any failing command fails its job and blocks every job that depends on it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install flake8
        run: pip install flake8==7.2.0
      - name: Run flake8
        run: |
          flake8 --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s' \
            | tee flake8-report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: flake8-report.txt

  test:
    name: Unit tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests with coverage
        run: |
          python -m pytest -v --junitxml=test-results/junit.xml \
            --cov=src/heart --cov=app --cov-report=xml:test-results/coverage.xml \
            --cov-report=html:test-results/htmlcov --cov-report=term-missing
      - name: Publish test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("test-results/junit.xml").getroot()
          s = r if r.tag == "testsuite" else r[0]
          print("### Unit tests")
          print(f"tests: {s.get('tests')} | failures: {s.get('failures')} | "
                f"errors: {s.get('errors')} | skipped: {s.get('skipped')} | time: {s.get('time')}s")
          EOF
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  train:
    name: Train & track (MLflow)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Download & clean data
        run: python scripts/download_data.py
      - name: EDA figures
        run: python -m heart.eda
      - name: Train models (GridSearchCV + MLflow)
        run: python -m heart.train 2>&1 | tee training.log
      - name: Quality gate (fail if champion is worse than threshold)
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("reports/metrics.json"))
          auc = m["cv"]["cv_roc_auc_mean"]
          print(f"champion={m['champion']} cv_roc_auc={auc:.3f} test_roc_auc={m['test']['test_roc_auc']:.3f}")
          sys.exit(0 if auc >= 0.85 else f"CV ROC-AUC {auc:.3f} below gate 0.85")
          EOF
      - name: Training summary
        run: |
          {
            echo "### Model comparison (5-fold CV on train split, held-out test)"
            python scripts/export_mlflow_runs.py --markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/
            reports/
            training.log
      - name: Upload MLflow tracking store
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlruns/
            mlflow.db
