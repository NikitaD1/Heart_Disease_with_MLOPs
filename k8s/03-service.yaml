# LoadBalancer service: Docker Desktop maps it to localhost:80, minikube exposes it
# with `minikube tunnel`, and GKE/EKS/AKS provision a cloud load balancer.
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-mlops
  labels:
    app: heart-api
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      port: 80
      targetPort: http
