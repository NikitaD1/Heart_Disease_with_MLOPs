apiVersion: v1
kind: Service
metadata:
  name: {{ include "heart-api.name" . }}
  labels: {{- include "heart-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "heart-api.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
